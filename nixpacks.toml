[phases.setup]
nixPkgs = ["nodejs_24"]

[variables]
NIXPACKS_NODE_VERSION = "24.15.0"
PORT = "9000"
HOSTNAME = "0.0.0.0"

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
	"npm run build",
	"test -f .medusa/server/public/admin/index.html",
	"cd .medusa/server && npm install --omit=dev",
]

[start]
cmd = "cd .medusa/server && npm run start"
